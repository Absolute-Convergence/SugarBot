<svg xmlns="http://www.w3.org/2000/svg" width="2360" height="3200" viewBox="0 0 2360 3200"><defs><linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#F7F7F7"/><stop offset="100%" stop-color="#EDEDED"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#111111" flood-opacity="0.08"/></filter><marker id="arrowBlack" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222222"/></marker></defs><rect x="0" y="0" width="2360" height="3200" rx="0" fill="url(#bg)" stroke="none" stroke-width="1" /><rect x="32" y="28" width="2296" height="3144" rx="24" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1" filter="url(#shadow)"/><rect x="60" y="118" width="250" height="2870" rx="18" fill="#F7F7F7" stroke="#CFCFCF" stroke-width="1" opacity="0.96" /><rect x="70" y="166" width="230" height="46" rx="12" fill="#FFFFFF" stroke="#CFCFCF" stroke-width="1" /><text x="185" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Operator / CLI shell</text><line x1="185" y1="226" x2="185" y2="2988" stroke="#CFCFCF" stroke-width="2" stroke-dasharray="6 8" opacity="0.85"/><rect x="330" y="118" width="250" height="2870" rx="18" fill="#FAFAFA" stroke="#BFBFBF" stroke-width="1" opacity="0.96" /><rect x="340" y="166" width="230" height="46" rx="12" fill="#FFFFFF" stroke="#BFBFBF" stroke-width="1" /><text x="455" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">sugar_client</text><line x1="455" y1="226" x2="455" y2="2988" stroke="#BFBFBF" stroke-width="2" stroke-dasharray="6 8" opacity="0.85"/><rect x="600" y="118" width="220" height="2870" rx="18" fill="#F7F7F7" stroke="#CFCFCF" stroke-width="1" opacity="0.96" /><rect x="610" y="166" width="200" height="46" rx="12" fill="#FFFFFF" stroke="#CFCFCF" stroke-width="1" /><text x="710" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Loopback TCP</text><line x1="710" y1="226" x2="710" y2="2988" stroke="#CFCFCF" stroke-width="2" stroke-dasharray="6 8" opacity="0.85"/><rect x="840" y="118" width="250" height="2870" rx="18" fill="#F9F9F9" stroke="#D6D6D6" stroke-width="1" opacity="0.96" /><rect x="850" y="166" width="230" height="46" rx="12" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1" /><text x="965" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">sugar_server</text><line x1="965" y1="226" x2="965" y2="2988" stroke="#D6D6D6" stroke-width="2" stroke-dasharray="6 8" opacity="0.85"/><rect x="1110" y="118" width="290" height="2870" rx="18" fill="#F2F2F2" stroke="#B8B8B8" stroke-width="1" opacity="0.96" /><rect x="1120" y="166" width="270" height="46" rx="12" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1" /><text x="1255" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">ProtocolDispatcher</text><line x1="1255" y1="226" x2="1255" y2="2988" stroke="#B8B8B8" stroke-width="2" stroke-dasharray="6 8" opacity="0.85"/><rect x="1420" y="118" width="320" height="2870" rx="18" fill="#EFEFEF" stroke="#B0B0B0" stroke-width="1" opacity="0.96" /><rect x="1430" y="166" width="300" height="46" rx="12" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1" /><text x="1580" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">ServerRuntime + workers</text><line x1="1580" y1="226" x2="1580" y2="2988" stroke="#B0B0B0" stroke-width="2" stroke-dasharray="6 8" opacity="0.85"/><rect x="1760" y="118" width="360" height="2870" rx="18" fill="#F5F5F5" stroke="#C8C8C8" stroke-width="1" opacity="0.96" /><rect x="1770" y="166" width="340" height="46" rx="12" fill="#FFFFFF" stroke="#C8C8C8" stroke-width="1" /><text x="1940" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Artifacts / results / engine</text><line x1="1940" y1="226" x2="1940" y2="2988" stroke="#C8C8C8" stroke-width="2" stroke-dasharray="6 8" opacity="0.85"/><rect x="60" y="218" width="2240" height="42" rx="10" fill="#111111" stroke="#111111" stroke-width="1" /><text x="78" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">Phase 1: Connect and session setup</text><rect x="60" y="682" width="2240" height="42" rx="10" fill="#111111" stroke="#111111" stroke-width="1" /><text x="78" y="708" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">Phase 2: Stage uploads</text><rect x="60" y="1146" width="2240" height="42" rx="10" fill="#111111" stroke="#111111" stroke-width="1" /><text x="78" y="1172" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">Phase 3: Validate</text><rect x="60" y="1702" width="2240" height="42" rx="10" fill="#111111" stroke="#111111" stroke-width="1" /><text x="78" y="1728" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">Phase 4: Submit and execute</text><rect x="60" y="2258" width="2240" height="42" rx="10" fill="#111111" stroke="#111111" stroke-width="1" /><text x="78" y="2284" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">Phase 5: Poll and retrieve</text><line x1="185" y1="337" x2="455" y2="337" stroke="#222222" stroke-width="3" marker-end="url(#arrowBlack)"/><rect x="97" y="300" width="446" height="74" rx="12" fill="#F6F6F6" stroke="#CFCFCF" stroke-width="1" /><text x="111" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="111" dy="0">1. Run `sugar_client connect --host 127.0.0.1 --port</tspan><tspan x="111" dy="18">4123`</tspan></text><line x1="455" y1="429" x2="1255" y2="429" stroke="#222222" stroke-width="3" marker-end="url(#arrowBlack)"/><rect x="652" y="392" width="406" height="74" rx="12" fill="#F6F6F6" stroke="#CFCFCF" stroke-width="1" /><text x="666" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="666" dy="0">Send framed JSON `op=connect` over loopback TCP</tspan></text><line x1="1255" y1="521" x2="1580" y2="521" stroke="#222222" stroke-width="3" marker-end="url(#arrowBlack)"/><rect x="1222" y="484" width="390" height="74" rx="12" fill="#F6F6F6" stroke="#CFCFCF" stroke-width="1" /><text x="1236" y="508" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="1236" dy="0">Create session and enforce live-session quota</tspan></text><line x1="1580" y1="613" x2="455" y2="613" stroke="#222222" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowBlack)"/><rect x="822" y="576" width="390" height="74" rx="12" fill="#F2F2F2" stroke="#D0D0D0" stroke-width="1" /><text x="836" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="836" dy="0">Return `session_id=sess-*` in a JSON response</tspan></text><line x1="185" y1="801" x2="455" y2="801" stroke="#222222" stroke-width="3" marker-end="url(#arrowBlack)"/><rect x="117" y="764" width="406" height="74" rx="12" fill="#F6F6F6" stroke="#CFCFCF" stroke-width="1" /><text x="131" y="788" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="131" dy="0">2. Upload layout JSON, logic JSON, and data CSV</tspan></text><line x1="455" y1="893" x2="1255" y2="893" stroke="#222222" stroke-width="3" marker-end="url(#arrowBlack)"/><rect x="628" y="856" width="454" height="74" rx="12" fill="#F6F6F6" stroke="#CFCFCF" stroke-width="1" /><text x="642" y="880" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="642" dy="0">Three `upload_artifact` requests with client filename</tspan><tspan x="642" dy="18">and bytes</tspan></text><path d="M 1255 985 H 1309 V 1021 H 1265" fill="none" stroke="#222222" stroke-width="3" marker-end="url(#arrowBlack)"/><rect x="1112" y="948" width="430" height="74" rx="12" fill="#F6F6F6" stroke="#CFCFCF" stroke-width="1" /><text x="1126" y="972" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="1126" dy="0">Check session ownership, per-artifact size, upload</tspan><tspan x="1126" dy="18">count, and staged bytes</tspan></text><line x1="1255" y1="1077" x2="455" y2="1077" stroke="#222222" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowBlack)"/><rect x="628" y="1040" width="454" height="74" rx="12" fill="#F2F2F2" stroke="#D0D0D0" stroke-width="1" /><text x="642" y="1064" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="642" dy="0">Return upload receipts `upl-*` for layout, logic, and</tspan><tspan x="642" dy="18">data</tspan></text><line x1="185" y1="1265" x2="455" y2="1265" stroke="#222222" stroke-width="3" marker-end="url(#arrowBlack)"/><rect x="97" y="1228" width="446" height="74" rx="12" fill="#F6F6F6" stroke="#CFCFCF" stroke-width="1" /><text x="111" y="1252" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="111" dy="0">3. Optional preflight: run `validate` with the three</tspan><tspan x="111" dy="18">upload ids</tspan></text><line x1="455" y1="1357" x2="1255" y2="1357" stroke="#222222" stroke-width="3" marker-end="url(#arrowBlack)"/><rect x="668" y="1320" width="374" height="74" rx="12" fill="#F6F6F6" stroke="#CFCFCF" stroke-width="1" /><text x="682" y="1344" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="682" dy="0">`validate_request` uses `layout_upload_id`,</tspan><tspan x="682" dy="18">`logic_upload_id`, and `data_upload_id`</tspan></text><line x1="1255" y1="1449" x2="1580" y2="1449" stroke="#222222" stroke-width="3" marker-end="url(#arrowBlack)"/><rect x="1202" y="1412" width="430" height="74" rx="12" fill="#F6F6F6" stroke="#CFCFCF" stroke-width="1" /><text x="1216" y="1436" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="1216" dy="0">Build submit request, stage workspace, and enqueue</tspan><tspan x="1216" dy="18">validation job</tspan></text><line x1="1580" y1="1541" x2="1940" y2="1541" stroke="#222222" stroke-width="3" marker-end="url(#arrowBlack)"/><rect x="1533" y="1504" width="454" height="74" rx="12" fill="#F6F6F6" stroke="#CFCFCF" stroke-width="1" /><text x="1547" y="1528" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="1547" dy="0">Validate staged artifacts and emit validation summary</tspan><tspan x="1547" dy="18">plus result artifact</tspan></text><line x1="1940" y1="1633" x2="455" y2="1633" stroke="#222222" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowBlack)"/><rect x="982" y="1596" width="430" height="74" rx="12" fill="#F2F2F2" stroke="#D0D0D0" stroke-width="1" /><text x="996" y="1620" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="996" dy="0">Terminal validation result includes resolved mode,</tspan><tspan x="996" dy="18">row counts, and warnings</tspan></text><line x1="185" y1="1821" x2="455" y2="1821" stroke="#222222" stroke-width="3" marker-end="url(#arrowBlack)"/><rect x="97" y="1784" width="446" height="74" rx="12" fill="#F6F6F6" stroke="#CFCFCF" stroke-width="1" /><text x="111" y="1808" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="111" dy="0">4. Execute hosted run or sweep with `submit` and the</tspan><tspan x="111" dy="18">same upload ids</tspan></text><line x1="455" y1="1913" x2="1255" y2="1913" stroke="#222222" stroke-width="3" marker-end="url(#arrowBlack)"/><rect x="700" y="1876" width="310" height="74" rx="12" fill="#F6F6F6" stroke="#CFCFCF" stroke-width="1" /><text x="714" y="1900" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="714" dy="0">Send `submit_job` over loopback TCP</tspan></text><line x1="1255" y1="2005" x2="1580" y2="2005" stroke="#222222" stroke-width="3" marker-end="url(#arrowBlack)"/><rect x="1206" y="1968" width="422" height="74" rx="12" fill="#F6F6F6" stroke="#CFCFCF" stroke-width="1" /><text x="1220" y="1992" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="1220" dy="0">Preflight shape validation, expensive-sweep</tspan><tspan x="1220" dy="18">policy, job id allocation, and fair queue enqueue</tspan></text><line x1="1580" y1="2097" x2="1940" y2="2097" stroke="#222222" stroke-width="3" marker-end="url(#arrowBlack)"/><rect x="1557" y="2060" width="406" height="74" rx="12" fill="#F6F6F6" stroke="#CFCFCF" stroke-width="1" /><text x="1571" y="2084" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="1571" dy="0">Worker validates, runs the engine path, records</tspan><tspan x="1571" dy="18">progress, and stores retained result data</tspan></text><line x1="1580" y1="2189" x2="455" y2="2189" stroke="#222222" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowBlack)"/><rect x="806" y="2152" width="422" height="74" rx="12" fill="#F2F2F2" stroke="#D0D0D0" stroke-width="1" /><text x="820" y="2176" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="820" dy="0">Return queued acknowledgement with `job_id=job-*`</tspan></text><line x1="185" y1="2377" x2="455" y2="2377" stroke="#222222" stroke-width="3" marker-end="url(#arrowBlack)"/><rect x="109" y="2340" width="422" height="74" rx="12" fill="#F6F6F6" stroke="#CFCFCF" stroke-width="1" /><text x="123" y="2364" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="123" dy="0">5. Poll `status`, then call `result` when the job</tspan><tspan x="123" dy="18">reaches a terminal state</tspan></text><line x1="455" y1="2469" x2="1255" y2="2469" stroke="#222222" stroke-width="3" marker-end="url(#arrowBlack)"/><rect x="668" y="2432" width="374" height="74" rx="12" fill="#F6F6F6" stroke="#CFCFCF" stroke-width="1" /><text x="682" y="2456" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="682" dy="0">`check_status` and `retrieve_results` carry</tspan><tspan x="682" dy="18">`session_id` plus `job_id`</tspan></text><line x1="1255" y1="2561" x2="1580" y2="2561" stroke="#222222" stroke-width="3" marker-end="url(#arrowBlack)"/><rect x="1190" y="2524" width="454" height="74" rx="12" fill="#F6F6F6" stroke="#CFCFCF" stroke-width="1" /><text x="1204" y="2548" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="1204" dy="0">Ownership gate rejects foreign or unknown job/session</tspan><tspan x="1204" dy="18">probes</tspan></text><line x1="1940" y1="2653" x2="455" y2="2653" stroke="#222222" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowBlack)"/><rect x="1006" y="2616" width="382" height="74" rx="12" fill="#F2F2F2" stroke="#D0D0D0" stroke-width="1" /><text x="1020" y="2640" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="start"><tspan x="1020" dy="0">Return structured status or result JSON with</tspan><tspan x="1020" dy="18">summary text and hosted sweep metadata</tspan></text><rect x="60" y="42" width="2240" height="96" rx="18" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1" filter="url(#shadow)"/><rect x="66" y="48" width="8" height="84" rx="4" fill="#111111" stroke="#111111" stroke-width="1" /><text x="92" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#111111" text-anchor="start">SugarBot Hosted-Service Event Flow</text><text x="92" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#333333" text-anchor="start">WSL/Linux loopback local server-client workflow</text></svg>