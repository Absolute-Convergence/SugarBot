      render();
      slideEl.classList.remove("replay");
      void slideEl.offsetWidth;
      slideEl.classList.add("replay");
    }
    function toggleAuto() {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        autoBtn.textContent = "Auto";
      } else {
        autoBtn.textContent = "Pause Auto";
        autoTimer = setInterval(() => current >= slides.length - 1 ? toggleAuto() : next(), 12000);
      }
    }
    document.getElementById("prev").addEventListener("click", prev);
    document.getElementById("next").addEventListener("click", next);
    document.getElementById("replay").addEventListener("click", replay);
    document.getElementById("auto").addEventListener("click", toggleAuto);
    document.getElementById("speak").addEventListener("click", speakCurrent);
    document.getElementById("pauseSpeech").addEventListener("click", toggleSpeechPause);
    document.getElementById("stopSpeech").addEventListener("click", stopSpeech);
    if (voiceSelect) {
      voiceSelect.addEventListener("change", () => {
        saveVoiceKey(voiceSelect.value);
        stopSpeech();
      });
    }
    if ("speechSynthesis" in window) {
      populateVoices();
      window.speechSynthesis.onvoiceschanged = populateVoices;
    } else {
      populateVoices();
    }
    document.addEventListener("keydown", event => {
      if (event.key === "ArrowRight") next();
      if (event.key === "ArrowLeft") prev();
      if (event.key === " ") { event.preventDefault(); toggleAuto(); }
      if (event.key.toLowerCase() === "s") speakCurrent();
      if (event.key.toLowerCase() === "x") stopSpeech();
    });
    window.addEventListener("beforeunload", stopSpeech);
    render();
  </script>
</body>
</html>
